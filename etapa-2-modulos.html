<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelForge - Etapa 2: Módulos Funcionais Semânticos</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; color: #1e293b; line-height: 1.6; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 1.25rem; }
    header { background: #ffffff; border-bottom: 1px solid #cbd5e1; padding: 0.8rem 0; }
    header .wrap { display: flex; gap: 1rem; align-items: center; }
    .logo { font-weight: 700; margin-right: auto; text-decoration: none; color: #0f172a; }
    section { padding: 2.5rem 0; border-bottom: 1px solid #cbd5e1; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-top: 1rem; }
    .card { background: #ffffff; border: 1px solid #94a3b8; border-radius: 6px; padding: 1rem; }
    [role="tablist"] { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
    [role="tab"] { padding: 0.4rem 0.9rem; border: 1px solid #64748b; background: #e2e8f0; cursor: pointer; }
    [role="tab"][aria-selected="true"] { background: #1e293b; color: #ffffff; }
    .carousel-box { background: #ffffff; border: 1px solid #94a3b8; padding: 1.5rem; text-align: center; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    input, textarea, select { width: 100%; padding: 0.5rem; margin-bottom: 0.8rem; border: 1px solid #64748b; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="#inicio">PixelForge</a>
      <nav aria-label="Principal">
        <a href="#glossario">Glossário</a> |
        <a href="#setups">Setups</a> |
        <a href="#contato">Contato</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="glossario">
      <h2>Glossário Gamer (Estrutura Interativa)</h2>
      <label for="q">Buscar termo:</label>
      <input id="q" type="search" placeholder="Ex.: FPS" style="max-width:300px;">
      <div role="tablist" aria-label="Filtrar por categoria">
        <button role="tab" data-f="todos" aria-selected="true">Todos</button>
        <button role="tab" data-f="Desempenho" aria-selected="false">Desempenho</button>
        <button role="tab" data-f="Hardware" aria-selected="false">Hardware</button>
      </div>
      <div id="lista" class="grid"></div>
    </section>

    <section id="setups">
      <h2>Galeria de Setups (Carrossel)</h2>
      <div class="carousel-box">
        <p id="slide-text">Setup compacto: um monitor, teclado e mouse bem posicionados.</p>
        <button id="prev">Anterior</button>
        <button id="next">Próxima</button>
      </div>
    </section>

    <section id="contato" class="form-grid">
      <div>
        <h2>Fale com a gente</h2>
        <p>Estrutura semântica do formulário com validação básica.</p>
      </div>
      <form id="form">
        <label for="nome">Nome</label>
        <input id="nome" required>
        <label for="email">E-mail</label>
        <input id="email" type="email" required>
        <label for="msg">Mensagem</label>
        <textarea id="msg" rows="3" required></textarea>
        <button type="submit">Enviar mensagem</button>
      </form>
    </section>
  </main>

  <script>
    const terms = [
      { n: "FPS", c: "Desempenho", d: "Quadros por segundo." },
      { n: "GPU", c: "Hardware", d: "Placa de vídeo." },
      { n: "Memória RAM", c: "Hardware", d: "Memória de trabalho do PC." }
    ];
    let filtro = "todos";
    function render() {
      const q = document.getElementById("q").value.toLowerCase();
      const filtrados = terms.filter(t => (filtro === "todos" || t.c === filtro) && t.n.toLowerCase().includes(q));
      document.getElementById("lista").innerHTML = filtrados.map(t => `<article class="card"><strong>${t.c}</strong><h3>${t.n}</h3><p>${t.d}</p></article>`).join("");
    }
    document.getElementById("q").oninput = render;
    document.querySelectorAll("[role=tab]").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("[role=tab]").forEach(b => b.setAttribute("aria-selected", "false"));
        btn.setAttribute("aria-selected", "true");
        filtro = btn.dataset.f;
        render();
      };
    });
    render();
  </script>
</body>
</html>
